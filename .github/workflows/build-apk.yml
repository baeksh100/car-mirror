name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Host build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Cache native prebuilts
        id: prebuilt
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/prebuilt
          key: prebuilt-${{ hashFiles('scripts/build-*.sh') }}

      - name: Vendor UxPlay
        run: ./scripts/vendor-uxplay.sh

      - name: Build native libraries
        if: steps.prebuilt.outputs.cache-hit != 'true'
        run: ./scripts/build-openssl.sh && ./scripts/build-libplist.sh && ./scripts/build-fdk-aac.sh

      # Every build gets a higher versionCode than the last, so the in-app updater (which reads
      # the build-main release) can tell a newer build apart.
      - name: Version
        run: |
          echo "CARMIRROR_VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "CARMIRROR_VERSION_SUFFIX=-$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk CarMirror-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarMirror-debug-apk
          path: CarMirror-debug.apk

      # A stable direct-download link per branch (open it in the tablet's browser).
      - name: Publish to a rolling pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(echo '${{ github.ref_name }}' | tr '/' '-')"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" CarMirror-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "CarMirror test build (${{ github.ref_name }})" \
            --notes "$(printf '자동 빌드된 테스트용 APK (커밋 %s). 다운로드 후 설치하세요.\n\nversionCode=%s\nversionName=0.93-car8%s\n' "${GITHUB_SHA::7}" "$CARMIRROR_VERSION_CODE" "$CARMIRROR_VERSION_SUFFIX")"
