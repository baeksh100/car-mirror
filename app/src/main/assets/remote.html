<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="차 리모컨">
<meta name="theme-color" content="#0e1116">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>차 리모컨</title>
<style>
  :root {
    --bg: #0e1116; --card: #181c23; --btn: #232933; --btn-on: #2e3642;
    --text: #eef1f5; --sub: #8b95a3; --ok: #3ccf7a; --bad: #ff5d5d; --accent: #4c9dff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.3 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    -webkit-user-select: none; user-select: none; }
  body { padding: max(14px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 8px; margin: 4px 2px 14px; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sub); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  #state { color: var(--sub); font-size: 13px; }
  section { background: var(--card); border-radius: 18px; padding: 12px; margin-bottom: 12px; }
  section h2 { font-size: 13px; color: var(--sub); font-weight: 600; margin: 2px 4px 10px; }
  .row { display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); }
  .row.four { grid-template-columns: repeat(4, 1fr); }
  small { font-size: 11px; color: var(--sub); margin-top: -4px; max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
  small:empty { display: none; }
  .tag { font-size: 10px; color: var(--accent); }
  .picking .apps button { outline: 2px dashed var(--accent); outline-offset: -2px; }
  #pickBar { display: none; margin-bottom: 10px; }
  .picking #pickBar { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  #pickBar button { min-height: 48px; }
  .picking h2#appsTitle { color: var(--accent); }
  button { -webkit-touch-callout: none; appearance: none; border: 0; border-radius: 14px; background: var(--btn); color: var(--text);
    font: inherit; font-size: 14px; padding: 12px 4px; min-height: 64px; touch-action: manipulation;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    transition: background .15s, transform .08s; }
  button:active { transform: scale(.96); background: var(--btn-on); }
  button.big { min-height: 96px; font-size: 15px; }
  button.ok { background: #1f4d33; } button.bad { background: #5a2323; }
  svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.2;
    stroke-linecap: round; stroke-linejoin: round; }
  button.big svg { width: 36px; height: 36px; }
  .vol { height: 6px; background: var(--btn); border-radius: 3px; margin: 12px 4px 2px; overflow: hidden; }
  .vol i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .apps { display: grid; gap: 10px; grid-template-columns: repeat(4, 1fr); }
  .apps button { min-height: 84px; font-size: 12px; padding: 8px 2px; }
  .apps img { width: 40px; height: 40px; border-radius: 10px; }
  .apps span { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
  .hint { font-weight: 400; font-size: 12px; margin-left: 6px; }
  #textIn { width: 100%; font: inherit; font-size: 18px; color: var(--text); background: var(--btn);
    border: 0; border-radius: 14px; padding: 14px; outline: none; -webkit-user-select: text; user-select: text; }
  #textIn:focus { box-shadow: 0 0 0 2px var(--accent); }
  #toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #000c; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }
  .muted { color: var(--sub); font-size: 13px; padding: 4px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1 id="name">차 리모컨</h1>
  <span id="state">연결 확인 중</span>
</header>

<section>
  <div class="row">
    <button class="big" data-cmd="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>뒤로</button>
    <button class="big" data-cmd="home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg>홈<small id="homeName"></small></button>
    <button class="big" data-cmd="recents"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>최근 앱</button>
  </div>
</section>

<section>
  <h2>글자 보내기 <span class="hint">캐스트에서 입력칸을 먼저 누르세요</span></h2>
  <form id="textForm" autocomplete="off">
    <input id="textIn" type="text" enterkeyhint="send" placeholder="여기에 입력 (한글 가능)" autocapitalize="off" autocorrect="off" spellcheck="false">
  </form>
  <div class="row four" style="margin-top:10px">
    <button id="sendText"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-6z"/></svg>보내기</button>
    <button data-cmd="backspace"><svg viewBox="0 0 24 24"><path d="M9 6h11v12H9l-5-6z"/><path d="M13 10l4 4M17 10l-4 4"/></svg>한 글자</button>
    <button data-cmd="cleartext"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>지우기</button>
    <button data-cmd="enter"><svg viewBox="0 0 24 24"><path d="M19 5v7H6"/><path d="M10 8l-4 4 4 4"/></svg>엔터</button>
  </div>
</section>

<section>
  <h2>화면</h2>
  <div class="row four">
    <button data-cmd="scrollup"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>위로</button>
    <button data-cmd="scrolldown"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>아래로</button>
    <button data-cmd="notifications"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/></svg>알림</button>
    <button data-cmd="quicksettings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>빠른 설정</button>
  </div>
</section>

<section>
  <h2>소리</h2>
  <div class="row">
    <button data-cmd="voldown"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 12h4"/></svg>작게</button>
    <button data-cmd="mute"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg><span id="muteLabel">음소거</span></button>
    <button data-cmd="volup"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 12h4M19 10v4"/></svg>크게</button>
  </div>
  <div class="vol"><i id="vol"></i></div>
</section>

<section>
  <h2>열기</h2>
  <div class="row four">
    <button data-cmd="carmirror"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>미러링</button>
    <button data-cmd="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>설정</button>
    <button id="pickHome"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 9v3l2 2"/></svg>홈 바꾸기</button>
    <button id="reload"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 5v6h-6"/></svg>새로고침</button>
  </div>
</section>

<section>
  <h2>전원</h2>
  <div class="row" style="grid-template-columns: 1fr 1fr">
    <button data-cmd="power"><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 7.5a8 8 0 1011.4 0"/></svg>전원 메뉴</button>
    <button id="reboot"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 5v6h-6"/></svg>캐스트 재시작</button>
  </div>
</section>

<section id="appsBox">
  <h2 id="appsTitle">캐스트 앱 (자주 쓰는 순)</h2>
  <div class="muted" id="pinHint" style="margin:-4px 4px 10px">길게 누르면 맨 앞에 고정(★), 다시 길게 누르면 풀려요.</div>
  <div id="pickBar">
    <button id="pickDefault">안드로이드 기본 홈</button>
    <button id="pickCancel">취소</button>
  </div>
  <div class="apps" id="apps"><div class="muted">불러오는 중…</div></div>
</section>

<div id="toast"></div>

<script>
(function () {
  var key = new URLSearchParams(location.search).get('k') || '';
  var q = '?k=' + encodeURIComponent(key);
  var TEXT_CMDS = { backspace: 1, cleartext: 1, enter: 1 };
  var dot = document.getElementById('dot'), state = document.getElementById('state');
  var toastEl = document.getElementById('toast'), toastTimer;

  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  function call(path) {
    var ctl = new AbortController();
    var t = setTimeout(function () { ctl.abort(); }, 3000);
    return fetch(path + (path.indexOf('?') < 0 ? q : '&k=' + encodeURIComponent(key)),
                 { cache: 'no-store', signal: ctl.signal })
      .then(function (r) { clearTimeout(t); if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  function online(ok) {
    dot.className = 'dot ' + (ok ? 'ok' : 'bad');
    state.textContent = ok ? '연결됨' : '연결 안 됨';
  }

  function show(s) {
    online(true);
    if (s.name) document.getElementById('name').textContent = s.name;
    if (s.max) document.getElementById('vol').style.width = (s.muted ? 0 : Math.round(100 * s.vol / s.max)) + '%';
    document.getElementById('muteLabel').textContent = s.muted ? '소리 켜기' : '음소거';
    document.getElementById('homeName').textContent = s.homeName || '';
  }

  function flash(b, ok) {
    b.classList.add(ok ? 'ok' : 'bad');
    setTimeout(function () { b.classList.remove('ok', 'bad'); }, 350);
  }

  document.querySelectorAll('[data-cmd]').forEach(function (b) {
    b.addEventListener('click', function () {
      call('/cmd/' + b.dataset.cmd).then(function (s) { flash(b, true); show(s); })
        .catch(function (e) {
          flash(b, false);
          // A status code means the car answered but could not do it (e.g. no input box).
          if (/^\d+$/.test(e.message)) {
            online(true);
            toast(TEXT_CMDS[b.dataset.cmd] ? '캐스트에서 입력칸을 먼저 눌러 주세요' : '캐스트에서 실행하지 못했어요');
          } else { online(false); toast('캐스트에 연결되지 않았어요'); }
        });
    });
  });
  // "홈 버튼 바꾸기": the next app tapped becomes what Home opens (e.g. the car mode launcher).
  var picking = false, title = document.getElementById('appsTitle');
  function setPicking(on) {
    picking = on;
    document.body.classList.toggle('picking', on);
    title.textContent = on ? '홈 버튼으로 열 앱을 누르세요' : '캐스트 앱 (자주 쓰는 순)';
    if (on) document.getElementById('appsBox').scrollIntoView({ behavior: 'smooth' });
  }
  function setHome(p, b) {
    call('/sethome?p=' + encodeURIComponent(p)).then(function (s) {
      setPicking(false); show(s); if (b) flash(b, true);
      toast(s.homeName ? '홈 버튼 → ' + s.homeName : '홈 버튼 → 안드로이드 기본 홈');
    }).catch(function () { toast('바꾸지 못했어요'); });
  }
  document.getElementById('pickHome').addEventListener('click', function () { setPicking(!picking); });
  document.getElementById('pickCancel').addEventListener('click', function () { setPicking(false); });
  document.getElementById('pickDefault').addEventListener('click', function () { setHome(''); });

  // Text: typed here, inserted at the cursor of the car's focused input box.
  var textIn = document.getElementById('textIn'), sendBtn = document.getElementById('sendText');
  function sendText() {
    var t = textIn.value;
    if (!t) { textIn.focus(); return; }
    call('/text?t=' + encodeURIComponent(t)).then(function () {
      flash(sendBtn, true); textIn.value = ''; toast('보냈어요');
    }).catch(function (e) {
      flash(sendBtn, false);
      toast(/^\d+$/.test(e.message) ? '캐스트에서 입력칸을 먼저 눌러 주세요' : '캐스트에 연결되지 않았어요');
    });
  }
  sendBtn.addEventListener('click', sendText);
  document.getElementById('textForm').addEventListener('submit', function (e) { e.preventDefault(); sendText(); });

  var rebootBtn = document.getElementById('reboot');
  rebootBtn.addEventListener('click', function () {
    if (!confirm('캐스트를 다시 시작할까요? 미러링이 잠시 끊겨요.')) return;
    call('/cmd/reboot').then(function (r) {
      flash(rebootBtn, true);
      toast(r.mode === 'reboot' ? '다시 시작하는 중이에요' : "캐스트 화면에서 '다시 시작'을 눌러 주세요");
    }).catch(function () { flash(rebootBtn, false); toast('다시 시작하지 못했어요'); });
  });

  document.getElementById('reload').addEventListener('click', function () { refresh(); loadApps(); });

  function loadApps() {
    var box = document.getElementById('apps');
    call('/apps').then(function (list) {
      box.innerHTML = '';
      list.forEach(function (a) {
        var b = document.createElement('button');
        var img = document.createElement('img');
        img.loading = 'lazy'; img.alt = '';
        img.src = '/icon?p=' + encodeURIComponent(a.p) + '&k=' + encodeURIComponent(key);
        var s = document.createElement('span'); s.textContent = a.n;
        b.appendChild(img); b.appendChild(s);
        if (a.launcher || a.pin) {
          var t = document.createElement('span'); t.className = 'tag';
          t.textContent = (a.pin ? '★ ' : '') + (a.launcher ? '런처' : '고정'); b.appendChild(t);
        }
        // Long press = pin / unpin (keeps the app at the front of this list).
        var pressTimer = null, longPressed = false;
        function startPress() {
          longPressed = false;
          pressTimer = setTimeout(function () {
            longPressed = true;
            call('/pin?p=' + encodeURIComponent(a.p) + '&on=' + (a.pin ? '0' : '1')).then(function () {
              toast(a.pin ? a.n + ' 고정 풀었어요' : a.n + ' 맨 앞에 고정했어요'); loadApps();
            }).catch(function () { toast('고정하지 못했어요'); });
          }, 550);
        }
        function endPress() { clearTimeout(pressTimer); }
        b.addEventListener('touchstart', startPress, { passive: true });
        b.addEventListener('touchend', endPress);
        b.addEventListener('touchmove', endPress, { passive: true });
        b.addEventListener('mousedown', startPress);
        b.addEventListener('mouseup', endPress);
        b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        b.addEventListener('click', function () {
          if (longPressed) { longPressed = false; return; }
          if (picking) return setHome(a.p, b);
          call('/open?p=' + encodeURIComponent(a.p)).then(function () { flash(b, true); })
            .catch(function () { flash(b, false); toast('앱을 열지 못했어요'); });
        });
        box.appendChild(b);
      });
    }).catch(function () { box.innerHTML = '<div class="muted">앱 목록을 불러오지 못했어요. 새로고침을 눌러 보세요.</div>'; });
  }

  function refresh() { call('/status').then(show).catch(function () { online(false); }); }

  refresh(); loadApps();
  setInterval(function () { if (!document.hidden) refresh(); }, 5000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
